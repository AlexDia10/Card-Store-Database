{% extends "base.html" %}

{% block content %}
<h2 class="report-title">{{ title }}</h2>

{% if data %}
<table>
    <thead>
        <tr>
            {% for column in columns %}
            <th>{{ column }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in data %}
        <tr>
            {% for value in row %}
            <td>{{ value }}</td>
            {% endfor %}
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>No data available for this report.</p>
{% endif %}

{% endblock %}
